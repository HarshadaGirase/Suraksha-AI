<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="SurakshaAI — a shield with a severed voice waveform">
  <!--
    The mark is the product: a shield (suraksha = protection) containing a
    voice waveform that is cut off mid-signal. The bars run full height on the
    left, then stop dead at the cut line — the outbound channel being severed
    the instant the guard arms. Nothing after the cut.

    Tokens are §16's: amber #FFB224 (golden hour), violet #8B5CF6, bg #0D0A14.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB224"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0D0A14"/>

  <!-- Shield -->
  <path d="M32 9 L51 16 v15c0 12-8 20-19 24-11-4-19-12-19-24V16z"
        fill="none" stroke="url(#g)" stroke-width="3.2"
        stroke-linejoin="round"/>

  <!-- Waveform: live on the left, silenced on the right -->
  <g stroke="#FFB224" stroke-width="3" stroke-linecap="round">
    <line x1="22" y1="28" x2="22" y2="38"/>
    <line x1="27" y1="24" x2="27" y2="42"/>
    <line x1="32" y1="20" x2="32" y2="46"/>
  </g>
  <!-- Past the cut the signal is gone; the stubs are what silence looks like -->
  <g stroke="#2A2140" stroke-width="3" stroke-linecap="round">
    <line x1="37" y1="32" x2="37" y2="34"/>
    <line x1="42" y1="32" x2="42" y2="34"/>
  </g>

  <!-- The cut itself -->
  <line x1="34.5" y1="17" x2="34.5" y2="49" stroke="#FF5470"
        stroke-width="2.4" stroke-linecap="round"/>
</svg>
