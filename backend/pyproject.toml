[project]
name = "surakshaai-backend"
version = "0.1.0"
description = "SurakshaAI — Hinglish voice fraud guardian and rescue agent"
requires-python = ">=3.11"

dependencies = [
    # STT — AssemblyAI streaming (CLAUDE.MD §5). 1.5.5 is the first release
    # carrying the streaming.v3 surface used throughout this codebase.
    "assemblyai>=1.5.5",

    # TTS — scenario and agent voices (§5 VOICE CASTING). No API key required.
    "edge-tts>=7.0.0",

    # Audio: edge-tts emits 24kHz MP3, AssemblyAI needs 16kHz PCM16 mono (§7.3).
    # soundfile bundles libsndfile (decodes MP3) and soxr resamples, so neither
    # needs a system ffmpeg install.
    "soundfile>=0.12.1",
    "soxr>=0.5.0",
    "numpy>=1.26",

    # Postgres (§12). asyncpg, not psycopg, because every call site is async
    # and a blocking driver would stall the WS#1 event loop mid-call.
    "asyncpg>=0.30.0",

    # LLM (§5, §10). Function-calling via models.generate_content.
    "google-genai>=2.25.0",

    # Pinned because google-genai caps websockets below 17 while assemblyai
    # needs >=11; an unpinned resolve on Render could pick a version that
    # satisfies neither at import time.
    "websockets>=13.0,<17.0",

    # PDF (§5). System libs (cairo/pango) are present in Render's Python
    # image; the Devanagari font is bundled in app/docs/fonts rather than
    # assumed, because that image does not ship one.
    "weasyprint>=70.0",

    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
